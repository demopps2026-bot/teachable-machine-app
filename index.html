<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      background: transparent;
    }

    #photo {
      margin: 10px;
    }

    #preview {
      max-width: 90%;
      max-height: 250px;
      margin-top: 10px;
      border-radius: 15px;
    }

    #prediction {
      font-size: 24px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<input
  type="file"
  id="photo"
  accept="image/*"
  capture="environment">

<img id="preview">

<div id="prediction">Loading model...</div>

<script>

const MODEL_URL =
"https://teachablemachine.withgoogle.com/models/SE5HAWtYTG/";

let model = null;


/* LOAD MODEL */

async function start() {

  try {

    model = await tmImage.load(
      MODEL_URL + "model.json",
      MODEL_URL + "metadata.json"
    );

    document.getElementById("prediction").innerText =
      "Ready";

  } catch (error) {

    document.getElementById("prediction").innerText =
      "Model error";

    console.error(error);
  }
}


/* TAKE PHOTO AND PREDICT */

document.getElementById("photo").addEventListener(
  "change",
  async function(event) {

    const file = event.target.files[0];

    if (!file || !model) return;

    const image = document.getElementById("preview");

    image.src = URL.createObjectURL(file);

    image.onload = async function() {

      try {

        const predictions =
          await model.predict(image);

        let best = predictions[0];

        for (let i = 1; i < predictions.length; i++) {

          if (
            predictions[i].probability >
            best.probability
          ) {
            best = predictions[i];
          }
        }

        /* ONLY OBJECT NAME */

        const result = best.className;

        document.getElementById("prediction").innerText =
          result;


        /* SEND OBJECT NAME TO MIT APP INVENTOR */

        if (
          window.AppInventor &&
          window.AppInventor.setWebViewString
        ) {

          window.AppInventor.setWebViewString(result);

        }

      } catch (error) {

        document.getElementById("prediction").innerText =
          "Prediction error";

        console.error(error);

      }

    };

  }
);


/* LISTEN FOR COMMAND FROM MIT APP INVENTOR */

let lastCommand = "";

setInterval(function() {

  if (
    window.AppInventor &&
    window.AppInventor.getWebViewString
  ) {

    const command =
      window.AppInventor.getWebViewString();

    if (
      command === "takephoto" &&
      command !== lastCommand
    ) {

      lastCommand = command;

      document.getElementById("photo").click();

    }

  }

}, 300);


/* START */

start();

</script>

</body>
</html>
