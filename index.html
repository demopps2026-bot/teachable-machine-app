<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #eaf8f7;
    text-align: center;
    overflow: hidden;
  }

  .camera-box {
    width: 94%;
    height: 230px;
    margin: 10px auto;
    border: 3px solid #9bd9e8;
    border-radius: 22px;
    background: rgba(255,255,255,0.45);
    position: relative;
    overflow: hidden;
  }

  .camera-icon {
    font-size: 55px;
    margin-top: 45px;
  }

  .instruction {
    font-size: 16px;
    color: #555;
    margin-top: 8px;
  }

  #photo {
    margin-top: 12px;
    font-size: 15px;
  }

  #preview {
    max-width: 90%;
    max-height: 210px;
    border-radius: 15px;
    display: none;
    margin: 10px auto;
  }

  #status {
    font-size: 16px;
    color: #555;
    margin: 8px;
  }

  #prediction {
    font-size: 24px;
    font-weight: bold;
    color: #222;
    margin-top: 10px;
  }

  .result-box {
    width: 90%;
    margin: 10px auto;
    padding: 12px;
    border-radius: 15px;
    background: rgba(255,255,255,0.7);
  }
</style>
</head>

<body>

<div class="camera-box">

  <div id="cameraContent">
    <div class="camera-icon">📷</div>
    <div class="instruction">
      Capture an object to identify it
    </div>

    <input
      type="file"
      id="photo"
      accept="image/*"
      capture="environment">
  </div>

  <img id="preview">

</div>

<div id="status">
  Loading model...
</div>

<div class="result-box">
  <div>OBJECT</div>
  <div id="prediction">No object detected</div>
</div>


<script>

const MODEL_URL =
"https://teachablemachine.withgoogle.com/models/SE5HAWtYTG/";

let model = null;


/* LOAD MODEL */

async function start() {

  try {

    model = await tmImage.load(
      MODEL_URL + "model.json",
      MODEL_URL + "metadata.json"
    );

    document.getElementById("status").innerText =
      "Ready to identify";

  } catch (error) {

    document.getElementById("status").innerText =
      "Model failed to load";

    console.error(error);
  }
}


/* PHOTO SELECTED */

document.getElementById("photo").addEventListener(
  "change",
  async function(event) {

    const file = event.target.files[0];

    if (!file || !model) return;

    const image =
      document.getElementById("preview");

    image.src =
      URL.createObjectURL(file);

    image.style.display = "block";

    document.getElementById("cameraContent").style.display =
      "none";

    document.getElementById("status").innerText =
      "Identifying...";

    image.onload = async function() {

      try {

        const predictions =
          await model.predict(image);

        let best = predictions[0];

        for (
          let i = 1;
          i < predictions.length;
          i++
        ) {

          if (
            predictions[i].probability >
            best.probability
          ) {

            best = predictions[i];

          }

        }


        /* ONLY OBJECT NAME */

        const result =
          best.className;


        /* SHOW RESULT */

        document.getElementById(
          "prediction"
        ).innerText = result;

        document.getElementById(
          "status"
        ).innerText = "Identification complete";


        /* SEND TO MIT APP INVENTOR */

        if (
          window.AppInventor &&
          window.AppInventor.setWebViewString
        ) {

          window.AppInventor.setWebViewString(
            result
          );

        }

      } catch (error) {

        document.getElementById(
          "status"
        ).innerText =
          "Could not identify object";

        console.error(error);

      }

    };

  }
);


/* RECEIVE COMMAND FROM MIT */

let lastCommand = "";

setInterval(function() {

  if (
    window.AppInventor &&
    window.AppInventor.getWebViewString
  ) {

    const command =
      window.AppInventor.getWebViewString();

    if (
      command === "takephoto" &&
      command !== lastCommand
    ) {

      lastCommand = command;

      document.getElementById(
        "photo"
      ).click();

    }

  }

}, 300);


/* START MODEL */

start();

</script>

</body>
</html>
